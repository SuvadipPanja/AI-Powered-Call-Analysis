# Sprint 3 — scale backend API behind nginx (sticky WebSocket sessions).
# Usage (on prod server with Docker Compose v2):
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# Requires: copy nginx/scale-api.conf into this folder before starting.

services:
  api-gateway:
    image: nginx:1.27-alpine
    container_name: sp_api_gateway
    ports:
      - "${BACKEND_HTTP_PORT:-5000}:5000"
    volumes:
      - ./nginx/scale-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [app-net]
    restart: unless-stopped

  backend:
    ports: !reset []
    environment:
      WS_REDIS_PUBSUB: "true"
      UPLOAD_QUEUE_ENABLED: "true"
      UPLOAD_QUEUE_CONCURRENCY: "2"
